<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frost Panel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-page">

    <div class="login-card">

      <div class="logo">
        FROST<span>.</span>
      </div>

      <div class="status">
        <span></span>
        SYSTEM ONLINE
      </div>

      <h1>Welcome back</h1>

      <p>
        Sign in to access your Frost control panel.
      </p>

      <form id="loginForm">

        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
        >

        <button type="submit">
          Sign in →
        </button>

      </form>

      <div class="login-footer">
        Frost Panel · 2026
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
